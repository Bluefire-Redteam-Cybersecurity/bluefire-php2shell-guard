# Bluefire Redteam — PHP2Shell ModSecurity policy
# CVE-2026-109618  CVE-2026-109619
# Interim control. Upgrade PHP and restart every worker.
# Soak with SecRuleEngine DetectionOnly on a copy of production traffic, then enforce.
# Local rule ids are in the 9001096xx range. Move them if they collide.

SecRuleEngine DetectionOnly
SecRequestBodyAccess On
SecRequestBodyLimit 8388608
SecRequestBodyNoFilesLimit 1048576
SecRequestBodyLimitAction Reject

SecRule REQUEST_HEADERS:Content-Type "@rx (?i)^multipart/form-data" \
    "id:900109618,phase:1,chain,deny,status:403,log,msg:'Bluefire PHP2Shell: multipart request has no Content-Length',tag:'CVE-2026-109618',tag:'bluefire'"
    SecRule &REQUEST_HEADERS:Content-Length "@eq 0"

SecRule REQUEST_HEADERS:Content-Type "@rx (?i)^multipart/form-data" \
    "id:900109619,phase:1,chain,deny,status:403,log,msg:'Bluefire PHP2Shell: chunked multipart request',tag:'CVE-2026-109618',tag:'bluefire'"
    SecRule REQUEST_HEADERS:Transfer-Encoding "@rx (?i)chunked"

SecRule ARGS_NAMES|FILES_NAMES "@rx (?:\[[^\]]*\]){8,}" \
    "id:900109621,phase:2,deny,status:403,log,msg:'Bluefire PHP2Shell: input nesting is too deep',tag:'CVE-2026-109618',tag:'bluefire'"

SecRule ARGS_NAMES|REQUEST_URI "@rx (?i)PHP_SESSION_UPLOAD_PROGRESS" \
    "id:900109622,phase:2,deny,status:403,log,msg:'Bluefire PHP2Shell: session upload progress',tag:'CVE-2026-109619',tag:'bluefire'"

SecRule MULTIPART_STRICT_ERROR "@eq 1" \
    "id:900109623,phase:2,deny,status:403,log,msg:'Bluefire PHP2Shell: malformed multipart body',tag:'CVE-2026-109618',tag:'bluefire'"
